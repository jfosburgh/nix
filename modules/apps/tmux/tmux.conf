unbind r
bind r source-file ~/.tmux.conf

unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

set -gq allow-passthrough on
set -gq allow-passthrough on

set -g mouse on

# Without this, programs can push their own title into the window name (#W,
# used for the tab label below) via escape sequences -- claude code sets a
# rolling description of the conversation, so tab width and text kept
# jumping around depending on which pane last wrote a title.
set-option -g allow-rename off

set-window-option -g mode-keys vi

# Flag a window's tab (as flamingo text, see window-status-activity-style
# below) when it produces output while not focused.
set-window-option -g monitor-activity on

# Keep window numbers contiguous (0,1,2,...) as windows close, instead of
# leaving gaps behind.
set -g renumber-windows on

bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# Ctrl+Tab / Ctrl+Shift+Tab cycle windows without the prefix key, matching
# browser-tab conventions. Binding tmux's own "C-Tab"/"C-S-Tab" key names
# didn't work: that requires the terminal to report the Ctrl/Shift modifiers
# on Tab (via tmux's extended-keys + the terminal's modifyOtherKeys/Kitty
# protocol), and that negotiation didn't come through correctly for Ghostty
# here even with extended-keys forced on. Sidestepping it entirely: Ghostty
# (modules/apps/ghostty/config) is bound to emit its own private CSI sequence
# for each combo unconditionally, and user-keys here just matches those
# literal bytes -- no modifier reporting involved at any point. Escaped as
# octal, not `\x1b` -- confirmed live (`tmux show -g user-keys`) that tmux's
# config-string parser has no \x hex escape and silently drops the backslash,
# leaving the literal letters "x1b..." as the key instead of an ESC byte.
set -s user-keys[0] "\033[250~"
set -s user-keys[1] "\033[251~"
bind-key -n User0 next-window
bind-key -n User1 previous-window

# Alt+Tab -> jump to the most-recently-used *session* (not window), toggling
# back and forth like OS-level Alt-Tab -- `switch-client -l` is tmux's own
# last-active-session tracking, updated on every session switch, so this is
# genuinely MRU rather than the numeric/creation-order cycling
# next-session/prev-session would give.
set -s user-keys[2] "\033[252~"
bind-key -n User2 switch-client -l

# set-option -g status-position top

# List of plugins. vim-tmux-navigator is a real functional plugin (pane
# navigation shared with vim's own splits); catppuccin/tmux was dropped
# after a lot of fighting with its version drift (renamed/removed options
# that silently no-op instead of erroring) and the format-string escaping
# depth required for indirected variables -- the bar below is built
# directly instead, using the same Catppuccin Macchiato hex values as
# everywhere else in this repo (modules/apps/hyprland/default.nix), no
# plugin involved.
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'

# Initialize TMUX plugin manager (keep this near the bottom of tmux.conf --
# only the status bar config below, which doesn't depend on any plugin,
# comes after it)
run '~/.tmux/plugins/tpm/tpm'

# Status bar. No background (matches the terminal), no window numbers, no
# powerline-style pills, no icons -- window/activity state is conveyed
# purely through text color. No separator between #W and anything else
# either; state is color-only.
set -g status-style "bg=default,fg=#cad3f5"
set -g status-left ""

set -g window-status-separator "│"
set -g window-status-style "fg=#a5adcb"
set -g window-status-format " #W "

# Mauve: the first (top, at the 90deg angle used in conf/looknfeel.lua)
# color of the active-window border gradient in Hyprland.
set -g window-status-current-style "bg=default,fg=#c6a0f6"
set -g window-status-current-format " #W "

# Flamingo: the second (bottom) color of that same border gradient.
set -g window-status-activity-style "fg=#f0c6c6"

set -g status-right-length 60
set -g status-right "#[fg=#8087a2]#{pane_current_path} │ #S │ %Y-%m-%d %H:%M "
