unbind r
bind r source-file ~/.tmux.conf

unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

set -gq allow-passthrough on
set -gq allow-passthrough on

set -g mouse on

# Without this, programs can push their own title into the window name (#W,
# used for the tab label below) via escape sequences -- claude code sets a
# rolling description of the conversation, so tab width and text kept
# jumping around depending on which pane last wrote a title.
set-option -g allow-rename off

set-window-option -g mode-keys vi

# Flag a window's tab (as flamingo text, see window-status-activity-style
# below) when it produces output while not focused.
set-window-option -g monitor-activity on

# Keep window numbers contiguous (0,1,2,...) as windows close, instead of
# leaving gaps behind.
set -g renumber-windows on

bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# set-option -g status-position top

# List of plugins. vim-tmux-navigator is a real functional plugin (pane
# navigation shared with vim's own splits); catppuccin/tmux was dropped
# after a lot of fighting with its version drift (renamed/removed options
# that silently no-op instead of erroring) and the format-string escaping
# depth required for indirected variables -- the bar below is built
# directly instead, using the same Catppuccin Macchiato hex values as
# everywhere else in this repo (modules/apps/hyprland/default.nix), no
# plugin involved.
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'

# Initialize TMUX plugin manager (keep this near the bottom of tmux.conf --
# only the status bar config below, which doesn't depend on any plugin,
# comes after it)
run '~/.tmux/plugins/tpm/tpm'

# Status bar. No background (matches the terminal), no window numbers, no
# powerline-style pills, no icons -- window/activity state is conveyed
# purely through text color. No separator between #W and anything else
# either; state is color-only.
set -g status-style "bg=default,fg=#cad3f5"
set -g status-left ""

set -g window-status-separator "│"
set -g window-status-style "fg=#a5adcb"
set -g window-status-format " #W "

# Mauve: the first (top, at the 90deg angle used in conf/looknfeel.lua)
# color of the active-window border gradient in Hyprland.
set -g window-status-current-style "bg=default,fg=#c6a0f6"
set -g window-status-current-format " #W "

# Flamingo: the second (bottom) color of that same border gradient.
set -g window-status-activity-style "fg=#f0c6c6"

set -g status-right-length 60
set -g status-right "#[fg=#8087a2]#{pane_current_path} │ #S │ %Y-%m-%d %H:%M "

# Two status lines: [0] is a plain solid-color rule that sits above [1] (the
# tree-choose display normally lives in slot 1, but plain window/session
# lists aren't used here, so it's repurposed for the real content instead).
# Order is index order top-to-bottom regardless of status-position.
set -g status 2
set -g status-format[0] "#[bg=#5b6078]"
set -g status-format[1] "#[align=left range=left #{E:status-left-style}]#[push-default]#{T;=/#{status-left-length}:status-left}#[pop-default]#[norange default]#[list=on align=#{status-justify}]#[list=left-marker]<#[list=right-marker]>#[list=on]#{W:#[range=window|#{window_index} #{E:window-status-style}#{?#{&&:#{window_last_flag},#{!=:#{E:window-status-last-style},default}}, #{E:window-status-last-style},}#{?#{&&:#{window_bell_flag},#{!=:#{E:window-status-bell-style},default}}, #{E:window-status-bell-style},#{?#{&&:#{||:#{window_activity_flag},#{window_silence_flag}},#{!=:#{E:window-status-activity-style},default}}, #{E:window-status-activity-style},}}]#[push-default]#{T:window-status-format}#[pop-default]#[norange default]#{?loop_last_flag,,#{E:window-status-separator}},#[range=window|#{window_index} list=focus #{?#{!=:#{E:window-status-current-style},default},#{E:window-status-current-style},#{E:window-status-style}}#{?#{&&:#{window_last_flag},#{!=:#{E:window-status-last-style},default}}, #{E:window-status-last-style},}#{?#{&&:#{window_bell_flag},#{!=:#{E:window-status-bell-style},default}}, #{E:window-status-bell-style},#{?#{&&:#{||:#{window_activity_flag},#{window_silence_flag}},#{!=:#{E:window-status-activity-style},default}}, #{E:window-status-activity-style},}}]#[push-default]#{T:window-status-current-format}#[pop-default]#[norange list=on default]#{?loop_last_flag,,#{E:window-status-separator}}}#[nolist align=right range=right #{E:status-right-style}]#[push-default]#{T;=/#{status-right-length}:status-right}#[pop-default]#[norange default]"
